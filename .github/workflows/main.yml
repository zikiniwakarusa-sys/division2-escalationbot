name: division2 bot

on:
  repository_dispatch:
    types: [run-bot]
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5 # ←ここだけ変更
      
      - uses: actions/setup-python@v5
        with: 
          python-version: "3.11"
          
      - run: pip install requests

      - run: python script.py
